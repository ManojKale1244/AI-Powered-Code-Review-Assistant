services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_code_review_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_code_review
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_code_review_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
